; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-relay-1ch]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; USE LITTLEFS INSTEAD OF SPIFFS
board_build.filesystem = littlefs

; Flash & PSRAM Settings for Waveshare ESP32-S3R8
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv

; CRITICAL: Tell PlatformIO that PSRAM is Octal (OPI) for the S3R8 chip
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; USB CDC & PSRAM Flags
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; dependencies
lib_ldf_mode = deep
lib_deps = 
    https://github.com/eModbus/eModbus.git
    https://github.com/theelims/PsychicMqttClient.git
    https://github.com/hoeken/PsychicHttp.git
    bblanchon/ArduinoJson @ ^7.4.1